name: Experiment 423 JPEG MCU constraint

on:
  pull_request:
    paths:
      - "scripts/audit_534brn_mcu_constraint.py"
      - "data/experiment-423-534brn-mcu-constraint.json"
      - ".github/workflows/audit-534brn-mcu-constraint.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_534brn_mcu_constraint.py
