name: Experiment 356 G6 reset reconciliation

on:
  pull_request:
    paths:
      - "scripts/audit_human_second_selection.py"
      - "scripts/audit_g6_selector_map_family.py"
      - "scripts/audit_idempotent_recursion.py"
      - "scripts/enumerate_raw_machine.py"
      - "data/observations.csv"
      - ".github/workflows/audit-g6-reset-reconciliation.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rerun Experiment 291
        run: |
          mkdir -p artifacts/experiment-356
          python scripts/audit_human_second_selection.py | tee artifacts/experiment-356/experiment-291.txt
      - name: Rerun Experiment 322
        run: |
          python scripts/audit_g6_selector_map_family.py | tee artifacts/experiment-356/experiment-322.txt
      - name: Rerun Experiment 269
        run: |
          python scripts/audit_idempotent_recursion.py | tee artifacts/experiment-356/experiment-269.txt
      - name: Upload reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: experiment-356-g6-reconciliation
          path: artifacts/experiment-356/
          if-no-files-found: error
