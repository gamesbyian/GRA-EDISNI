name: CE public Reddit reply-photo discovery pilot

on:
  pull_request:
    paths:
      - ".github/workflows/ce-comment-media-pilot-20261013.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"
      - name: Query exact public archived Reddit comment trees
        run: |
          python scripts/external_evidence/recover_reddit_comment_images.py \
            --manifest data/reference/inside-ce-visual-historical-pages.json \
            --out visual-evidence-work --max-comments 600
      - name: Download twenty sourced negative controls
        run: python scripts/external_evidence/fetch_visual_references.py
      - name: Retrieve only bounded approved public images linked from these comments
        run: |
          python scripts/external_evidence/fetch_html_images.py \
            --leads visual-evidence-work/reddit-comment-photo-links.json \
            --out evidence-work --max-images 40 --max-per-page 15
      - name: Fingerprint comment media against known original stickers and promotional controls
        run: |
          python scripts/external_evidence/visual_index.py \
            --candidates evidence-work --max-files 200 --max-matches 8
      - name: Print structured source-first live comment-photo pilot report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def read(name,key):
            p=Path(name)
            if not p.exists(): return []
            try: return json.loads(p.read_text()).get(key,[])
            except (ValueError,OSError): return []
          threads=read("visual-evidence-work/reddit-comment-archive-report.json","sources")
          links=read("visual-evidence-work/reddit-comment-photo-links.json","image_mentions")
          galleries=read("visual-evidence-work/reddit-comment-gallery-review.json","gallery_links")
          photos=read("evidence-work/html-image-download-report.json","image_downloads")
          refs=read("visual-reference-work/retrieval-report.json","sources")
          triage=read("visual-evidence-work/visual-matches.json","triage")
          matches=read("visual-evidence-work/visual-matches.json","matches")
          print("CE_COMMENT_MEDIA_AUDIT_BEGIN")
          print("SUMMARY",json.dumps({"threads":len(threads),"linked_images":len(links),
            "galleries":len(galleries),"downloaded":sum(x.get("status")=="downloaded" for x in photos),
            "attempted_images":len(photos),"reference_images":sum(x.get("status") in ("downloaded","local-existing") for x in refs),
            "triage":len(triage),"matches":len(matches)}))
          for label, rows, keys in [
            ("THREAD",threads,("source_id","status","provider","archive_sha256",
                              "comments_returned","possible_partial_tree","direct_image_urls","gallery_links","attempts")),
            ("PHOTO",links,("source_id","source_page_url","image_url","comment_id","created_utc","keyword_hints")),
            ("GALLERY",galleries,("source_id","source_page_url","image_url","comment_id","keyword_hints")),
            ("RETRIEVAL",photos,("source_id","source_page_url","image_url","status","sha256","bytes","error")),
            ("MATCH",matches,("candidate_source_url","candidate_image_url","reference_id","kind")),
            ("TRIAGE",triage,("source_url","image_url","classification"))]:
              print(label+"_COUNT",len(rows))
              for item in rows[:100]:
                print(label,json.dumps({k:item.get(k) for k in keys if k in item},ensure_ascii=False))
          print("CE_COMMENT_MEDIA_AUDIT_END")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ce-comment-media-pilot-${{ github.run_id }}
          path: |
            visual-reference-work/
            visual-evidence-work/
            evidence-work/
          retention-days: 30
          if-no-files-found: warn
