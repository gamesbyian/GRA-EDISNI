name: CE historical exact resale ID probe

# One-shot public archive request. Intentionally never merged.
on:
  pull_request:
    paths:
      - ".github/workflows/ce-historical-resale-exact-id-20261013.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: One bounded archived batch of five exact known public post IDs
        run: python scripts/external_evidence/lookup_public_ce_resale_posts.py
      - name: Print compact source-linked findings including complete failure states
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("visual-evidence-work/exact-ce-resale-posts.json")
          if not p.exists():
            print("EXACT_POST_PROBE_NO_REPORT")
          else:
            data=json.loads(p.read_text())
            print("EXACT_POST_PROBE",json.dumps({k:data.get(k) for k in ("status","reason","archive_sha256","requested_ids")},ensure_ascii=False))
            for row in data["records"]:
              print("POST",json.dumps({k:row.get(k) for k in
                ("post_id","id","source_page_url","status","created_utc","source_role","context_excerpt","direct_image_urls","gallery_urls","source_status")
                if k in row},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ce-exact-post-pilot-${{ github.run_id }}
          path: visual-evidence-work/exact-ce-resale-posts.json
          retention-days: 30
          if-no-files-found: warn
