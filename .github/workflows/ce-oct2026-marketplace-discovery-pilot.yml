name: CE public October 2026 original sold-listing discovery

# One-shot bounded public HTML source diagnostic. Do not merge workflow.
on:
  pull_request:
    paths:
      - ".github/workflows/ce-oct2026-marketplace-discovery-pilot.yml"
permissions:
  contents: read

jobs:
  public-marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Fetch four source-scoped public sold-listing and mirror result pages
        run: |
          mkdir -p evidence-work/october2026-marketplace
          python - <<'PY'
          import hashlib,json,re,time,urllib.request,urllib.error,urllib.parse
          from pathlib import Path
          from bs4 import BeautifulSoup
          root=Path("evidence-work/october2026-marketplace")
          targets=[
            ("ebay-sold-inside", "https://www.ebay.com/sch/i.html?_nkw=INSIDE+iam8bit+collector+edition&LH_Complete=1&LH_Sold=1&_sop=13"),
            ("ebay-sold-huddle", "https://www.ebay.com/sch/i.html?_nkw=INSIDE+Playdead+Huddle&LH_Complete=1&LH_Sold=1&_sop=13"),
            ("ebay-auctions-inside", "https://www.ebay.com/sch/i.html?_nkw=INSIDE+iam8bit+collector&LH_Auction=1&LH_Complete=1&LH_Sold=1&_sop=13"),
            ("picclick-inside", "https://picclick.com/?q=INSIDE+iam8bit+collector+edition"),
          ]
          entries=[]
          for key,url in targets:
            status={"query_id":key,"source_url":url,"status":"not-attempted"}
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; PublicCEArchiveReview/1.0)","Accept":"text/html"})
              with urllib.request.urlopen(req,timeout=20) as response:
                data=response.read(2_000_001)
                status.update(http_status=response.status,final_url=response.url,
                              content_type=response.headers.get_content_type(),
                              bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
                if len(data)>2_000_000: raise ValueError("response above 2 MiB")
                if response.headers.get_content_type()!="text/html": raise ValueError("not HTML")
                parsed=urllib.parse.urlparse(response.url)
                if parsed.hostname not in {"www.ebay.com","picclick.com","www.picclick.com"}:
                  raise ValueError("redirect away from public approved merchant")
              html=data.decode("utf-8","replace")
              soup=BeautifulSoup(html,"html.parser")
              title=soup.title.get_text(" ",strip=True)[:160] if soup.title else ""
              status["page_title"]=title
              status["page_excerpt"]=soup.get_text(" ",strip=True)[:350]
              if any(word in title.lower() for word in ("robot check","security measure","captcha")):
                status["status"]="merchant-blocked"
              else:
                status["status"]="public-html-returned"
              candidates=[]
              seen=set()
              for a in soup.select("a[href]"):
                href=urllib.parse.urljoin(response.url,a.get("href",""))
                parsed=urllib.parse.urlparse(href)
                if parsed.hostname not in {"www.ebay.com","ebay.com","picclick.com","www.picclick.com"}:continue
                item=re.search(r"/itm/(?:[^/?]+/)?(\d{12})(?!\d)",parsed.path)
                if not item and "picclick" in parsed.hostname:
                  item=re.search(r"-(\d{12})\.html",parsed.path)
                if not item or item.group(1) in seen:continue
                nearest=a
                for k in range(4):
                  if nearest.parent is None:break
                  nearest=nearest.parent
                  if any("s-item" in c for c in nearest.get("class",[])) or nearest.name=="article":break
                caption=(nearest.get_text(" ",strip=True) or a.get_text(" ",strip=True))[:320]
                imgs=[x.get("data-src") or x.get("src") for x in nearest.select("img")[:3]]
                if "inside" not in caption.lower():continue
                if not any(t in caption.lower() for t in ("collector","playdead","huddle","realdoll","iam8bit")):continue
                seen.add(item.group(1))
                candidates.append({"item_id":item.group(1),"source_url":href.split("?")[0],
                                   "text_excerpt":caption,"image_urls":[x for x in imgs if x][:3],
                                   "classification":"public-unverified-search-hit"})
              status["candidate_count"]=len(candidates)
              status["candidates"]=candidates[:35]
              if status["status"]=="merchant-blocked":status["candidates"]=[]
            except urllib.error.HTTPError as e:
              status.update(status="merchant-http-error",http_status=e.code,reason=str(e)[:140],
                            retry_after=e.headers.get("Retry-After","") if e.headers else "")
              if e.code==429:
                entries.append(status)
                break
            except Exception as e:
              status.update(status="merchant-unavailable",reason=str(e)[:180])
            entries.append(status)
            print("PUBLIC_CE_MARKETPLACE",json.dumps(status,ensure_ascii=False)[:22000],flush=True)
            time.sleep(2)
          out={"schema_version":1,"sources":entries,
               "interpretation":"Listings/search-result rows are not inspected original photos, physical CE copies or sticker observations."}
          (root/"audit.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          PY
      - name: Diagnose three PicClick public source-search layouts and item links
        run: |
          python - <<'PY'
          import hashlib,json,re,time,urllib.request,urllib.parse,collections
          from pathlib import Path
          from bs4 import BeautifulSoup
          out=[]
          for key,query in [
            ("inside-realdoll","inside realdoll"),
            ("inside-ce","INSIDE collector's edition"),
            ("inside-iam8bit","inside iam8bit"),
          ]:
            target="https://picclick.com/?"+urllib.parse.urlencode({"q":query})
            result={"id":key,"url":target}
            try:
              req=urllib.request.Request(target,headers={
                "User-Agent":"Mozilla/5.0 (compatible; PublicCEArchiveReview/1.0)",
                "Accept":"text/html"})
              with urllib.request.urlopen(req,timeout=20) as stream:
                raw=stream.read(1_500_001)
                if len(raw)>1_500_000:raise ValueError("response size limit")
                result.update(status=stream.status,bytes=len(raw),
                              response_sha256=hashlib.sha256(raw).hexdigest())
              soup=BeautifulSoup(raw,"html.parser")
              result["page_title"]=soup.title.get_text(" ",strip=True) if soup.title else ""
              text=soup.get_text(" ",strip=True)
              result["visible_text_excerpt"]=text[:750]
              result["visible_text_tail"]=text[-450:]
              anchors=[]
              for a in soup.find_all("a",href=True):
                href=urllib.parse.urljoin(target,a["href"])
                item=re.search(r"-(\d{12})\.html(?:\?|$)",href)
                alt=" ".join(str(img.get("alt","")) for img in a.find_all("img"))
                title=a.get_text(" ",strip=True) or alt
                if item or any(word in (title+" "+href).lower() for word in
                               ("inside","iam8bit","playdead","realdoll","huddle")):
                  anchors.append({"href":href[:350],"title":title[:180],"item_id":item.group(1) if item else None})
              result["total_anchor_count"]=len(soup.find_all("a",href=True))
              result["plausible_source_anchors"]=anchors[:65]
              result["distinct_picclick_ids"]=len(set(x["item_id"] for x in anchors if x["item_id"]))
              result["12_digit_ids_in_page"]=len(set(re.findall(r"(?<!\d)\d{12}(?!\d)",raw.decode("utf-8","replace"))))
            except Exception as exc:
              result["status"]="unavailable"
              result["reason"]=str(exc)[:220]
            out.append(result)
            print("PICCLICK_DIAGNOSTIC",json.dumps(result,ensure_ascii=False)[:20000],flush=True)
            time.sleep(2)
          dest=Path("evidence-work/october2026-marketplace/picclick-diagnostic.json")
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps({"schema_version":1,"sources":out},indent=2,ensure_ascii=False)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ce-october2026-public-marketplace-sources-${{ github.run_id }}
          path: evidence-work/october2026-marketplace/
          retention-days: 21
          if-no-files-found: warn
