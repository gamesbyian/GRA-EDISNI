name: CE visual provenance / image discovery

on:
  pull_request:
    paths:
      - "scripts/external_evidence/visual_index.py"
      - "scripts/external_evidence/discover_html_images.py"
      - "scripts/external_evidence/fetch_visual_references.py"
      - "scripts/external_evidence/fetch_html_images.py"
      - "scripts/external_evidence/recover_reddit_image_links.py"
      - "scripts/external_evidence/recover_reddit_comment_images.py"
      - "scripts/external_evidence/index_public_imgur_gallery.py"
      - "scripts/external_evidence/search_public_reddit_ce_media.py"
      - "scripts/external_evidence/lookup_public_ce_resale_posts.py"
      - "scripts/external_evidence/audit_historic_ebay_ce_sales.py"
      - "scripts/external_evidence/probe_ce_ebay_wayback.py"
      - "scripts/external_evidence/probe_ce_ebay_cdx.py"
      - "scripts/external_evidence/audit_public_ce_thread_claims.py"
      - "scripts/external_evidence/audit_public_ce_split_sale_leads.py"
      - "scripts/external_evidence/audit_public_ce_october_auction.py"
      - "scripts/external_evidence/visual_semantic.py"
      - "tests/test_ce_visual_provenance.py"
      - "tests/test_ce_html_image_discovery.py"
      - "tests/test_ce_public_reddit_archive.py"
      - "tests/test_ce_reddit_comment_images.py"
      - "tests/test_ce_public_imgur_gallery.py"
      - "tests/test_ce_public_reddit_market_search.py"
      - "tests/test_ce_archive_search_reliability.py"
      - "tests/test_ce_historic_ebay_index.py"
      - "tests/test_ce_ebay_wayback_availability.py"
      - "tests/test_ce_ebay_cdx_index.py"
      - "tests/test_ce_public_thread_claims.py"
      - "tests/test_ce_public_split_sale_leads.py"
      - "tests/test_ce_oct2026_auction_lead.py"
      - "data/reference/inside-ce-visual-sources.json"
      - "data/reference/inside-ce-archived-public-galleries.json"
      - "data/reference/inside-ce-public-reddit-cross-community-queries.json"
      - "data/reference/inside-ce-public-archived-resale-posts.json"
      - "data/reference/inside-ce-curated-known-public-sale-links.json"
      - "data/reference/inside-ce-public-historic-ebay-sale-index.json"
      - "data/reference/inside-ce-2026-disc-retained-acquisition-leads.json"
      - "data/reference/inside-ce-oct2026-ebay-auction-public-lead.json"
      - "data/reference/inside-ce-visual-historical-pages.json"
      - ".github/workflows/ce-visual-provenance.yml"
  workflow_dispatch:
    inputs:
      source_id:
        description: "Existing public acquisition source ID, or 'none' for reference-only indexing"
        required: true
        default: "none"
        type: string
      include_media:
        description: "Download source video (can be large); not needed for metadata thumbnails"
        required: true
        default: false
        type: boolean
      historical_pages:
        description: "Also fetch six documented public owner/photo/press pages (no media download)"
        required: true
        default: false
        type: boolean
      archived_reddit_images:
        description: "Also try bounded public Arctic Shift/PullPush archive metadata for blocked Reddit owner posts"
        required: true
        default: false
        type: boolean
      archived_reddit_comment_images:
        description: "Also search public historical Reddit comment trees for CE/sticker photo URLs"
        required: true
        default: false
        type: boolean
      archived_waitlist_claim_audit:
        description: "Audit one historical 2020 CE waitlist thread for self-contradictory buying claims"
        required: true
        default: false
        type: boolean
      historical_ebay_cdx_check:
        description: "Inspect up to seven public Wayback CDX capture indexes for exact old eBay IDs"
        required: true
        default: false
        type: boolean
      historical_ebay_wayback_check:
        description: "Check Wayback public snapshot availability for seven historic eBay item IDs"
        required: true
        default: false
        type: boolean
      archived_ce_resale_exact_ids:
        description: "Look up five specific historical CE post IDs, without keyword search"
        required: true
        default: false
        type: boolean
      archived_cross_community_search:
        description: "Search up to 24 bounded public Reddit collector and resale queries"
        required: true
        default: false
        type: boolean
      archived_reddit_comment_galleries:
        description: "Attempt two documented public Imgur galleries from 2019 shipping thread (max 12 items each)"
        required: true
        default: false
        type: boolean
      download_page_images:
        description: "Download at most 48 approved public HTML-discovered image URLs"
        required: true
        default: false
        type: boolean
      max_images:
        description: "Maximum images to fingerprint; shard large batches"
        required: true
        default: "500"
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"
      - run: python -m unittest discover -s tests -p 'test_ce_*py' -v
      - run: python -m py_compile scripts/external_evidence/visual_index.py scripts/external_evidence/fetch_visual_references.py scripts/external_evidence/visual_semantic.py scripts/external_evidence/discover_html_images.py scripts/external_evidence/fetch_html_images.py scripts/external_evidence/recover_reddit_image_links.py scripts/external_evidence/recover_reddit_comment_images.py scripts/external_evidence/index_public_imgur_gallery.py scripts/external_evidence/search_public_reddit_ce_media.py scripts/external_evidence/lookup_public_ce_resale_posts.py scripts/external_evidence/audit_historic_ebay_ce_sales.py scripts/external_evidence/probe_ce_ebay_wayback.py scripts/external_evidence/probe_ce_ebay_cdx.py scripts/external_evidence/audit_public_ce_thread_claims.py scripts/external_evidence/audit_public_ce_split_sale_leads.py scripts/external_evidence/audit_public_ce_october_auction.py
      - name: Index all canonical original sticker photographs and validate source SHA256
        run: |
          mkdir -p /tmp/ce-empty-candidate-set
          python scripts/external_evidence/visual_index.py \
            --candidates /tmp/ce-empty-candidate-set --output /tmp/ce-canonical-reference-index
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("/tmp/ce-canonical-reference-index/reference-index.json").read_text())
          assert len([r for r in p["references"] if r["role"] == "known-sticker-photo"]) >= 82
          assert all(r["sha256"] for r in p["references"])
          PY

  public-run:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "Pillow>=10,<13" "yt-dlp[default]" gallery-dl
      - name: Fetch verified public marketing photo controls
        run: python scripts/external_evidence/fetch_visual_references.py
      - name: Harvest one public manifest source
        if: inputs.source_id != 'none'
        env:
          SOURCE_ID: ${{ inputs.source_id }}
          INCLUDE_MEDIA: ${{ inputs.include_media }}
        run: |
          args=(--source-id "$SOURCE_ID")
          if [[ "$INCLUDE_MEDIA" == "true" ]]; then args+=(--include-media); fi
          python scripts/external_evidence/harvest_public.py "${args[@]}"
      - name: Optionally harvest documented historical owner/photo/press pages
        if: inputs.historical_pages
        run: |
          python scripts/external_evidence/harvest_public.py \
            --manifest data/reference/inside-ce-visual-historical-pages.json \
            --source-id all
      - name: Extract image URLs from already acquired public HTML
        run: |
          mkdir -p evidence-work
          python scripts/external_evidence/discover_html_images.py \
            --acquired evidence-work --output visual-evidence-work/html-image-leads.json
      - name: Optionally recover blocked Reddit public image metadata
        if: inputs.archived_reddit_images
        run: |
          python scripts/external_evidence/recover_reddit_image_links.py \
            --manifest data/reference/inside-ce-visual-historical-pages.json \
            --out visual-evidence-work
      - name: Optionally recover archived public Reddit comment photo URLs
        if: inputs.archived_reddit_comment_images
        run: |
          python scripts/external_evidence/recover_reddit_comment_images.py \
            --manifest data/reference/inside-ce-visual-historical-pages.json \
            --out visual-evidence-work --max-comments 600
      - name: Optionally look up known public CE resale post IDs exactly
        if: inputs.archived_ce_resale_exact_ids
        run: python scripts/external_evidence/lookup_public_ce_resale_posts.py
      - name: Optionally discover public cross-community archived resale/collector sources
        if: inputs.archived_cross_community_search
        run: |
          python scripts/external_evidence/search_public_reddit_ce_media.py \
            --manifest data/reference/inside-ce-public-reddit-cross-community-queries.json \
            --max-queries 8 --per-query 25
      - name: Optionally download bounded public image URLs from harvested pages
        if: inputs.download_page_images
        run: |
          args=(--leads visual-evidence-work/html-image-leads.json --out evidence-work \
            --max-images 48 --max-per-page 8)
          if [[ -f visual-evidence-work/reddit-archival-image-leads.json ]]; then
            args+=(--additional-leads visual-evidence-work/reddit-archival-image-leads.json)
          fi
          if [[ -f visual-evidence-work/reddit-comment-photo-links.json ]]; then
            args+=(--additional-leads visual-evidence-work/reddit-comment-photo-links.json)
          fi
          if [[ -f visual-evidence-work/archived-market-discovery/image-leads.json ]]; then
            args+=(--additional-leads visual-evidence-work/archived-market-discovery/image-leads.json)
          fi
          python scripts/external_evidence/fetch_html_images.py "${args[@]}"
      - name: Optionally retrieve two historical source-verified Imgur galleries
        if: inputs.archived_reddit_comment_galleries
        shell: bash
        run: |
          for id in ipjWYEz YLXcetH; do
            mkdir -p "evidence-work/gallery-$id"
            timeout 90s gallery-dl --range 1-12 --filesize-max 20M \
              --dest "evidence-work/gallery-$id" --write-metadata \
              "https://imgur.com/gallery/$id" \
              > "evidence-work/gallery-$id/gallery-dl.log" 2>&1 || echo "gallery unavailable: $id"
          done
          python scripts/external_evidence/index_public_imgur_gallery.py \
            --manifest data/reference/inside-ce-archived-public-galleries.json \
            --root evidence-work
      - name: Audit historical sale IDs against community sticker original ledger
        if: inputs.historical_ebay_wayback_check
        run: python scripts/external_evidence/audit_historic_ebay_ce_sales.py
      - name: Opt-in one-shot archived eBay snapshot availability check
        if: inputs.historical_ebay_wayback_check
        run: python scripts/external_evidence/probe_ce_ebay_wayback.py
      - name: Opt-in bounded Wayback CDX capture-index metadata query
        if: inputs.historical_ebay_cdx_check
        run: python scripts/external_evidence/probe_ce_ebay_cdx.py
      - name: Optionally audit 2020 archived waitlist same-author purchase retractions
        if: inputs.archived_waitlist_claim_audit
        run: python scripts/external_evidence/audit_public_ce_thread_claims.py --post-id fhvflq
      - name: Build provenance index and candidate triage
        env:
          MAX_IMAGES: ${{ inputs.max_images }}
        run: |
          mkdir -p evidence-work
          python scripts/external_evidence/visual_index.py \
            --candidates evidence-work --max-files "$MAX_IMAGES" \
            --output visual-evidence-work
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ce-visual-provenance-${{ github.run_id }}
          path: |
            visual-reference-work/
            visual-evidence-work/
            evidence-work/
          retention-days: 14
          if-no-files-found: warn
