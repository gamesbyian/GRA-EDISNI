# Temporary scoped source-acquisition experiment. Remove after archived result is
# retrieved, rather than adding recurring network dependence to normal CI.
name: CL-04 Gate98 byte-exact source
on:
  pull_request:
    paths:
      - .github/workflows/cl04-gate98-source.yml
      - scripts/conjecture_lab_gate98_real_pixels.py
      - scripts/conjecture_lab_gate98_palette_enrichment.py
      - scripts/conjecture_lab_gate98_cf_palette.py
permissions:
  contents: read
jobs:
  source-image:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image reader
        run: python -m pip install 'Pillow>=10,<13'
      - name: Scan original pinned 19.36 MB gate-98 source
        run: python scripts/conjecture_lab_gate98_real_pixels.py --output gate98-cl04-results.json
      - name: Audit exact RGB marker spatial enrichment
        run: python scripts/conjecture_lab_gate98_palette_enrichment.py --output gate98-cl04b-palette.json
      - name: Test complete candidate three-bit exact-colour palette
        run: python scripts/conjecture_lab_gate98_cf_palette.py --output gate98-cl04c-threebit.json
      - name: Preserve complete candidate bit-palette matrix for repository
        run: |
          echo "CL04C_COMPACT_JSON=$(python -c 'import json;print(json.dumps(json.load(open("gate98-cl04c-threebit.json")),separators=(",",":")))' )"
      - name: Preserve small exact result for repository research record
        run: echo "CL04_RESULT_JSON_B64=$(base64 -w0 gate98-cl04-results.json)"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gate98-cl04-exact-replay
          path: |
            gate98-cl04-results.json
            gate98-cl04b-palette.json
            gate98-cl04c-threebit.json
          retention-days: 14
