# Temporary one-off acquisition and source-registered overlay control.
name: CL05 Gate98 historical RGB reconstruction
on:
  pull_request:
    paths:
      - .github/workflows/cl05-source-positive-control.yml
      - scripts/conjecture_lab_gate98_positive_control.py
      - scripts/conjecture_lab_gate98_all_amplitudes.py
      - scripts/conjecture_lab_gate98_phase_replay.py
permissions:
  contents: read
jobs:
  source-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source image decoder
        run: python -m pip install 'Pillow>=10,<13'
      - name: Reconstruct colour layers from byte-exact original image
        run: python scripts/conjecture_lab_gate98_positive_control.py --output cl05-original-rgb-layers.json --preserve-source gate98-original.png
      - name: Exhaustive nontext 255-amplitude 16px lattice test
        run: python scripts/conjecture_lab_gate98_all_amplitudes.py --output cl05-source-all-rgb-levels.json
      - name: Audit reproducible colour amplitude source output
        run: echo "CL05_LEVELS_COMPLETE"
      - name: Independently infer exact-black source phase and replay CE banks
        run: python scripts/conjecture_lab_gate98_phase_replay.py --source gate98-original.png --output cl05-phase-replay.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cl05-gate98-rgb-positive-control
          path: |
            cl05-original-rgb-layers.json
            cl05-source-all-rgb-levels.json
            gate98-original.png
            cl05-phase-replay.json
          retention-days: 14
