# One-time primary-source preservation job. Delete after result acquisition.
name: CL06 historic gate98 reference
on:
  pull_request:
    paths:
      - .github/workflows/cl06-historic-reference.yml
permissions:
  contents: read
jobs:
  historic-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acquire dated historic Game Detectives reference
        run: |
          python - <<'PY'
          import hashlib, struct, urllib.request
          source = "https://wiki.gamedetectives.net/images/0/07/Inside_activate_shutdown.png"
          request = urllib.request.Request(source, headers={"User-Agent":"Mozilla/5.0 (historical research; source attribution to Game Detectives)"})
          try:
              with urllib.request.urlopen(request, timeout=35) as response:
                  b = response.read(250000)
          except Exception as e:
              print("HISTORICAL_WIKI_FAILED",type(e).__name__,str(e))
              raise
          assert b[:8] == bytes.fromhex("89504e470d0a1a0a")
          w,h = struct.unpack(">II", b[16:24])
          assert (w,h)==(916,913), (w,h)
          open("cl06-inside-activate-shutdown-2019.png","wb").write(b)
          print("HISTORICAL_SOURCE",source)
          print("HISTORICAL_SIZE",len(b))
          print("HISTORICAL_SHA256",hashlib.sha256(b).hexdigest())
          print("HISTORICAL_DIMENSIONS",w,h)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cl06-gamedetectives-historical-image-2019
          path: cl06-inside-activate-shutdown-2019.png
          retention-days: 14
