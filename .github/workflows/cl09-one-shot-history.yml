name: CL09 one-shot exact damaged source audit
on:
  pull_request:
    paths:
      - .github/workflows/cl09-one-shot-history.yml
      - scripts/audit_534brn_original_a_comparison.py
permissions:
  contents: read
jobs:
  true-a-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/cl09-2020-primary-source-registration-history-2026-10-08
      - name: Recompute original true A against connector-rendition and P/B
        run: python scripts/audit_534brn_original_a_comparison.py --output cl09-true-a-delta.json
      - uses: actions/upload-artifact@v4
        with:
          name: cl09-true-original-a-delta
          path: |
            cl09-true-a-delta.json
            archive/external/terminal41-534brn/A-original-capture.bin
          retention-days: 7
