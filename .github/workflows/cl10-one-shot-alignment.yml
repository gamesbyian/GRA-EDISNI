name: CL10 one-shot original A alignment sensitivity
on:
  pull_request:
    paths:
      - .github/workflows/cl10-one-shot-alignment.yml
      - scripts/audit_534brn_true_a_alignment_sensitivity.py
permissions:
  contents: read
jobs:
  true-a-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Original A five-alignment fixed-heuristic stress
        run: python scripts/audit_534brn_true_a_alignment_sensitivity.py --freeze --output-json cl10-true-a-five-alignments.json
      - uses: actions/upload-artifact@v4
        with:
          name: cl10-true-a-five-alignments
          path: cl10-true-a-five-alignments.json
          retention-days: 7
