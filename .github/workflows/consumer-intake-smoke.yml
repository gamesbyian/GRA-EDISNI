name: Offline consumer intake fixture
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/consumer_binary_intake.py'
      - 'scripts/test_consumer_binary_intake.py'
      - 'scripts/audit_decompiled_consumer_hits.py'
      - 'scripts/test_decompiled_consumer_hits.py'
      - 'scripts/audit_managed_consumer_structures.py'
      - 'scripts/test_managed_consumer_structures.py'
      - 'scripts/run_local_consumer_recon.sh'
      - 'scripts/run_ghidra_consumer_local.sh'
      - 'scripts/ghidra/InspectConsumerStrings.java'
      - '.github/workflows/consumer-intake-smoke.yml'
      - 'docs/consumer-binary-recon-pilot-2026-10-12.md'
permissions:
  contents: read
jobs:
  fixture-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offline synthetic binary and C# fixtures
        run: |
          python scripts/test_consumer_binary_intake.py -v
          python scripts/test_decompiled_consumer_hits.py -v
          python scripts/test_managed_consumer_structures.py -v
          bash -n scripts/run_local_consumer_recon.sh scripts/run_ghidra_consumer_local.sh
