name: Export deck refresh sources

on:
  push:
    branches:
      - docs/deck-and-evidence-update-plan-2026-09-29
    paths:
      - .github/workflows/export-deck-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect source artifacts
        run: |
          mkdir -p /tmp/deck-refresh-sources
          cp archive/drive/INSIDE_Collector_Edition_Sticker_Mystery_What_I_found_and_what_it_might_mean.pptx /tmp/deck-refresh-sources/
          cp archive/drive/INSIDE_Sticker_Mystery_Verification_Pack.xlsx /tmp/deck-refresh-sources/
          cp archive/drive/INSIDE_Sticker_Mystery_Supplementary_Evidence.csv /tmp/deck-refresh-sources/
      - uses: actions/upload-artifact@v4
        with:
          name: deck-refresh-sources
          path: /tmp/deck-refresh-sources
          retention-days: 1
