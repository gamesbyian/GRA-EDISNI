name: External evidence availability audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 2"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit known URLs
        run: python scripts/external_evidence/audit_urls.py
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: external-evidence-url-audit
          path: evidence-work/url-audit.json
          retention-days: 14
