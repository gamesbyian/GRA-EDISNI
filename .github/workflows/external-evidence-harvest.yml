name: External evidence public harvest

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: "Manifest source id, or all"
        required: true
        default: "all"
        type: string
      include_media:
        description: "Download public video/media, not just metadata"
        required: true
        default: false
        type: boolean
      include_social:
        description: "Attempt public gallery-dl social extraction"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install extractors
        run: python -m pip install --disable-pip-version-check "yt-dlp[default]" gallery-dl
      - name: Materialize optional YouTube cookie jar
        shell: bash
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$YOUTUBE_COOKIES_B64" ]]; then
            echo "No YouTube cookie secret configured; continuing with public extraction only."
            exit 0
          fi
          cookie_file="${RUNNER_TEMP}/youtube-cookies.txt"
          printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$cookie_file"
          chmod 600 "$cookie_file"
          echo "YTDLP_COOKIES_FILE=$cookie_file" >> "$GITHUB_ENV"
      - name: Harvest
        shell: bash
        run: |
          set -euo pipefail
          args=(--source-id "${{ inputs.source_id }}")
          if [[ "${{ inputs.include_media }}" == "true" ]]; then
            args+=(--include-media)
          fi
          if [[ "${{ inputs.include_social }}" == "true" ]]; then
            args+=(--include-social)
          fi
          python scripts/external_evidence/harvest_public.py "${args[@]}"
      - name: Discover untracked links
        if: always()
        run: |
          if [[ -d evidence-work ]]; then
            python scripts/external_evidence/discover_leads.py evidence-work || true
          fi
      - name: Upload harvest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-evidence-harvest-${{ github.run_id }}
          path: evidence-work/
          if-no-files-found: warn
          retention-days: 14
