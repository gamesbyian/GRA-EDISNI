name: External evidence public harvest

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: "Manifest source id, or all"
        required: true
        default: "all"
        type: string
      include_media:
        description: "Download public video/media, not just metadata"
        required: true
        default: false
        type: boolean
      include_social:
        description: "Attempt public gallery-dl social extraction"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install extractors
        run: python -m pip install --disable-pip-version-check yt-dlp gallery-dl
      - name: Harvest
        shell: bash
        run: |
          set -euo pipefail
          args=(--source-id "${{ inputs.source_id }}")
          if [[ "${{ inputs.include_media }}" == "true" ]]; then
            args+=(--include-media)
          fi
          if [[ "${{ inputs.include_social }}" == "true" ]]; then
            args+=(--include-social)
          fi
          python scripts/external_evidence/harvest_public.py "${args[@]}"
      - name: Discover untracked links
        if: always()
        run: |
          if [[ -d evidence-work ]]; then
            python scripts/external_evidence/discover_leads.py evidence-work || true
          fi
      - name: Upload harvest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-evidence-harvest-${{ github.run_id }}
          path: evidence-work/
          if-no-files-found: warn
          retention-days: 14
