name: External evidence public smoke harvest

on:
  pull_request:
    paths:
      - "scripts/external_evidence/**"
      - "data/external-acquisition-targets.json"
      - ".github/workflows/external-evidence-public-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        source_id:
          - terminal41-saf-dat-col
          - youtube-iam8bit-ce-unboxing
          - youtube-inside-gaming-ce-unboxing
          - youtube-oddheader-2026-mystery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public extractors
        run: python -m pip install --disable-pip-version-check yt-dlp gallery-dl
      - name: Materialize optional YouTube cookie jar
        shell: bash
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          set -euo pipefail
          if [[ -n "$YOUTUBE_COOKIES_B64" ]]; then
            cookie_file="${RUNNER_TEMP}/youtube-cookies.txt"
            printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$cookie_file"
            chmod 600 "$cookie_file"
            echo "YTDLP_COOKIES_FILE=$cookie_file" >> "$GITHUB_ENV"
            echo "Authenticated YouTube cookie jar materialized."
          else
            echo "No YouTube cookie secret available; continuing unauthenticated."
          fi
      - name: Harvest one source without large media
        run: python scripts/external_evidence/harvest_public.py --source-id "${{ matrix.source_id }}"
      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.source_id }}-${{ github.run_id }}
          path: evidence-work/
          if-no-files-found: warn
          retention-days: 14
