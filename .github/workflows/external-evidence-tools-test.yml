name: External evidence tool checks

on:
  pull_request:
    paths:
      - "scripts/external_evidence/**"
      - "scripts/audit_ce_search_run_health.py"
      - "scripts/probe_inside_ce_wayback_cdx.py"
      - "tests/test_ce_search_run_health.py"
      - "tests/test_ce_search_execution_failures.py"
      - "tests/test_inside_ce_wayback_cdx.py"
      - "tests/test_ce_public_reddit_market_search.py"
      - "data/reference/inside-ce-search-pipeline-risk-matrix-2026-10-16.tsv"
      - "data/external-acquisition-targets.json"
      - ".github/workflows/external-evidence-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python helpers
        run: python -m py_compile scripts/external_evidence/*.py
      - name: Verify cross-pipeline search execution and censoring controls
        run: |
          python -m unittest discover -s tests -p 'test_ce_search_run_health.py' -v
          python -m unittest discover -s tests -p 'test_ce_search_execution_failures.py' -v
          python -m unittest discover -s tests -p 'test_inside_ce_wayback_cdx.py' -v
          python -m unittest discover -s tests -p 'test_ce_public_reddit_market_search.py' -v
      - name: Parse acquisition manifest
        run: python -m json.tool data/external-acquisition-targets.json >/dev/null
      - name: Exercise Git blob verifier
        shell: bash
        run: |
          printf 'hello evidence\n' > /tmp/evidence.txt
          expected="$(git hash-object /tmp/evidence.txt)"
          python scripts/external_evidence/verify_git_blob.py /tmp/evidence.txt "$expected" --size 15
      - name: Verify committed Terminal 41 saf_dat_col
        run: |
          python scripts/external_evidence/verify_git_blob.py \
            archive/external/twinysam-inside-arg/terminal41.link/dat/saf_dat_col.html \
            349b818fce618ef55c404bedfb602b1d03f29a48 \
            --size 1986163
      - name: Exercise lead discovery
        shell: bash
        run: |
          mkdir -p /tmp/evidence-leads
          printf '%s\n' 'https://example.invalid/new-lead' > /tmp/evidence-leads/sample.txt
          python scripts/external_evidence/discover_leads.py /tmp/evidence-leads --output /tmp/leads.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/leads.json').read_text())
          assert payload['count'] == 1, payload
          PY
