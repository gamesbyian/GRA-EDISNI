name: External evidence tool checks

on:
  pull_request:
    paths:
      - "scripts/external_evidence/**"
      - "data/external-acquisition-targets.json"
      - ".github/workflows/external-evidence-*.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python helpers
        run: python -m py_compile scripts/external_evidence/*.py
      - name: Parse acquisition manifest
        run: python -m json.tool data/external-acquisition-targets.json >/dev/null
      - name: Exercise Git blob verifier
        shell: bash
        run: |
          printf 'hello evidence\n' > /tmp/evidence.txt
          expected="$(git hash-object /tmp/evidence.txt)"
          python scripts/external_evidence/verify_git_blob.py /tmp/evidence.txt "$expected" --size 15
      - name: Verify committed Terminal 41 saf_dat_col
        run: |
          python scripts/external_evidence/verify_git_blob.py \
            archive/external/twinysam-inside-arg/terminal41.link/dat/saf_dat_col.html \
            349b818fce618ef55c404bedfb602b1d03f29a48 \
            --size 1986163
      - name: Exercise lead discovery
        shell: bash
        run: |
          mkdir -p /tmp/evidence-leads
          printf '%s\n' 'https://example.invalid/new-lead' > /tmp/evidence-leads/sample.txt
          python scripts/external_evidence/discover_leads.py /tmp/evidence-leads --output /tmp/leads.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/leads.json').read_text())
          assert payload['count'] == 1, payload
          PY

  persist-l14-forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Check whether bundle already exists
        id: bundle
        shell: bash
        run: |
          if [[ -f archive/external/inside-gaming-l14/forensic-review/README.md ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.bundle.outputs.needed == 'true'
        with:
          python-version: "3.12"
      - name: Install forensic tooling
        if: steps.bundle.outputs.needed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check "yt-dlp[default]" pillow numpy opencv-python-headless scikit-image
      - name: Materialize YouTube cookie jar
        if: steps.bundle.outputs.needed == 'true'
        shell: bash
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_COOKIES_B64"
          cookie_file="${RUNNER_TEMP}/youtube-cookies.txt"
          printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$cookie_file"
          chmod 600 "$cookie_file"
          echo "YTDLP_COOKIES_FILE=$cookie_file" >> "$GITHUB_ENV"
      - name: Download bounded L14 source and reference
        if: steps.bundle.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/l14"
          yt-dlp \
            --js-runtimes node \
            --cookies "$YTDLP_COOKIES_FILE" \
            --download-sections "*00:01:10-00:01:25" \
            --force-keyframes-at-cuts \
            -f "bv*+ba/b" \
            --merge-output-format mkv \
            --paths "$RUNNER_TEMP/l14" \
            --output "inside-gaming-0110-0125.%(ext)s" \
            "https://www.youtube.com/watch?v=AO2YQCl5qFM"
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/l14/known-324.jpg" \
            "https://raw.githubusercontent.com/twinysam/INSIDE-ARG/master/images/stickers/324.jpg"
      - name: Reproduce L14 review images
        if: steps.bundle.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          video="$(find "$RUNNER_TEMP/l14" -maxdepth 1 -type f \( -name '*.mkv' -o -name '*.mp4' -o -name '*.webm' \) | head -n 1)"
          out="archive/external/inside-gaming-l14/forensic-review"
          mkdir -p "$out"
          python scripts/external_evidence/reproduce_l14_forensics.py \
            --video "$video" \
            --reference-sticker "$RUNNER_TEMP/l14/known-324.jpg" \
            --output "$out"
          cat > "$out/README.md" <<'EOF'
# Inside Gaming L14 forensic review bundle

Source: Inside Gaming Collector's Edition unboxing, YouTube `AO2YQCl5qFM`.
Historical identity: lost sticker **L14**, symbol **`/`**, serial unknown.

These files are non-generative forensic review aids derived from native source-video pixels.
A known `324` sticker photo is used only as a layout/degradation reference.

Methods represented include native-frame contact sheets, nearest/Lanczos enlargement,
channel inspection, conservative sharpening, Richardson-Lucy deconvolution,
geometric normalization, adjacent-frame ECC registration, and temporal stacking.

The serial-number zone is geometrically occluded by fingers throughout the useful sequence.
No numeral is promoted from faint marks elsewhere on the exposed label.

`clean324_simulated*.jpg` are degradation sanity checks, not evidence about L14.

Reproduction script: `scripts/external_evidence/reproduce_l14_forensics.py`.
EOF
      - name: Commit forensic bundle
        if: steps.bundle.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/external/inside-gaming-l14/forensic-review
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "archive: preserve L14 forensic review bundle"
          git push origin "HEAD:${{ github.head_ref }}"
