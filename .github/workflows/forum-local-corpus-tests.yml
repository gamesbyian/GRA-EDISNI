name: Forum local corpus search tests

on:
  pull_request:
    paths:
      - "scripts/forum_local_search.py"
      - "tests/test_forum_local_search.py"
      - "requirements-forum-archives.txt"
      - ".github/workflows/forum-local-corpus-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/forum_local_search.py"
      - "tests/test_forum_local_search.py"
      - "requirements-forum-archives.txt"
      - ".github/workflows/forum-local-corpus-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-forum-archives.txt
      - run: python -m unittest discover -s tests -p test_forum_local_search.py -v
