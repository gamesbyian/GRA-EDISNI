name: Plan multilingual gaming-forum searches

on:
  workflow_dispatch:
    inputs:
      terms:
        description: "One arbitrary search query per line; Unicode supported"
        required: true
        type: string
      query_mode:
        description: "Literal phrases or search-engine expressions"
        required: true
        default: literal
        type: choice
        options:
          - literal
          - expression
      statuses:
        description: "Include verified leads, candidates, or all"
        required: true
        default: V,C,H
        type: choice
        options:
          - V,C,H
          - V
          - V,C
          - V,H
      execute_index:
        description: "Run an explicitly authorized, limited Brave web-index pass"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
      start_index:
        description: "Index of first unsearched task from the previous run (default 0)"
        required: true
        default: "0"
        type: string
      manifest_sha256:
        description: "Required on resumed runs: paste manifest SHA256 from prior summary"
        required: false
        default: ""
        type: string
      max_index_queries:
        description: "Paid API query budget for optional Brave pass, 1-1000"
        required: true
        default: "20"
        type: string
      max_tasks:
        description: "Hard budget for forum x query task count"
        required: true
        default: "10000"
        type: string

permissions:
  contents: read

jobs:
  plan-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test cumulative index cursor and rate-limit regression
        run: python -m unittest discover -s tests -p test_global_forum_index_resume.py -v
      - name: Verify matrix and planner tests
        run: python -m unittest discover -s tests -p 'test_global_forum_search_plan.py' -v
      - name: Build offline campaign plan (no target-site traffic)
        env:
          SEARCH_TERMS: ${{ inputs.terms }}
          SEARCH_MODE: ${{ inputs.query_mode }}
          SEARCH_STATUSES: ${{ inputs.statuses }}
          SEARCH_MAX_TASKS: ${{ inputs.max_tasks }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          pathlib.Path("forum-queries.txt").write_text(
              os.environ["SEARCH_TERMS"], encoding="utf-8"
          )
          subprocess.run([
              "python", "scripts/plan_global_forum_searches.py",
              "--terms-file", "forum-queries.txt",
              "--query-mode", os.environ["SEARCH_MODE"],
              "--statuses", os.environ["SEARCH_STATUSES"],
              "--max-tasks", os.environ["SEARCH_MAX_TASKS"],
              "--output", "search-output/forum-search-tasks.jsonl",
              "--summary", "search-output/forum-search-summary.json",
          ], check=True)
          PY
      - name: Optional bounded web-index lookup (never crawls forums)
        if: ${{ inputs.execute_index == 'yes' }}
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          MAX_INDEX_QUERIES: ${{ inputs.max_index_queries }}
          INDEX_START: ${{ inputs.start_index || '0' }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 || '' }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          subprocess.run([
              "python", "scripts/run_global_forum_index_search.py",
              "--tasks", "search-output/forum-search-tasks.jsonl",
              "--output", "search-output/index-results.jsonl",
              "--summary", "search-output/index-summary.json",
              "--max-queries", os.environ["MAX_INDEX_QUERIES"],
              "--start-index", os.environ["INDEX_START"],
              "--expect-manifest-sha256", os.environ["EXPECTED_MANIFEST_SHA256"],
          ], check=True)
          PY
      - name: Upload prepared search tasks and summary
        uses: actions/upload-artifact@v4
        with:
          name: forum-search-plan
          path: search-output/
          if-no-files-found: error
          retention-days: 30
