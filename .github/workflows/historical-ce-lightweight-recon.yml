name: Historical CE lightweight reconnaissance

on:
  push:
    branches:
      - chatgpt/external-evidence-harvester-2026-09-29
    paths:
      - .github/workflows/historical-ce-lightweight-recon.yml
  workflow_dispatch:
    inputs:
      source_id:
        description: Single YouTube acquisition target
        required: true
        type: choice
        default: youtube-ledger-08-d23bAqGtImo
        options:
          - youtube-ledger-01-eXxklNxsVWw
          - youtube-ledger-07-Pbkq8Ey_s0k
          - youtube-ledger-08-d23bAqGtImo

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_ID: ${{ inputs.source_id || 'youtube-ledger-08-d23bAqGtImo' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight media tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check "yt-dlp[default]"
      - name: Materialize YouTube cookie jar
        shell: bash
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_COOKIES_B64"
          cookie_file="${RUNNER_TEMP}/youtube-cookies.txt"
          printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$cookie_file"
          chmod 600 "$cookie_file"
          echo "YTDLP_COOKIES_FILE=$cookie_file" >> "$GITHUB_ENV"
      - name: Resolve source URL
        id: source
        shell: bash
        run: |
          url="$(python - <<'PY'
          import json, os
          sid = os.environ["SOURCE_ID"]
          data = json.load(open("data/external-acquisition-targets.json", encoding="utf-8"))
          print(next(s["url"] for s in data["sources"] if s["id"] == sid))
          PY
          )"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Download low-resolution video only
        shell: bash
        run: |
          set -euo pipefail
          out="evidence-work/$SOURCE_ID"
          mkdir -p "$out/source"
          yt-dlp \
            --js-runtimes node \
            --cookies "$YTDLP_COOKIES_FILE" \
            --write-info-json \
            --write-thumbnail \
            --no-write-subs \
            --no-write-auto-subs \
            -f "bestvideo[height<=240]/worstvideo" \
            --paths "$out/source" \
            --output "%(id)s.%(ext)s" \
            "${{ steps.source.outputs.url }}"
      - name: Extract whole-source and scene reconnaissance
        shell: bash
        run: |
          set -euo pipefail
          out="evidence-work/$SOURCE_ID"
          video="$(find "$out/source" -type f \( -name '*.mp4' -o -name '*.webm' -o -name '*.mkv' \) | head -n 1)"
          test -n "$video"
          mkdir -p "$out/recon/sample-1s" "$out/recon/scenes"
          ffmpeg -hide_banner -loglevel warning -i "$video" -vf fps=1 -vsync vfr "$out/recon/sample-1s/frame-%06d.jpg"
          ffmpeg -hide_banner -loglevel warning -i "$video" -vf "select='gt(scene,0.25)'" -vsync vfr "$out/recon/scenes/scene-%06d.jpg"
      - name: Upload lightweight reconnaissance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ce-light-recon-${{ env.SOURCE_ID }}-${{ github.run_id }}
          path: |
            evidence-work/${{ env.SOURCE_ID }}/recon/
            evidence-work/${{ env.SOURCE_ID }}/source/*.json
            evidence-work/${{ env.SOURCE_ID }}/source/*.webp
          if-no-files-found: warn
          retention-days: 14
