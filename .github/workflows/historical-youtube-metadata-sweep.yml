name: Historical YouTube metadata sweep

on:
  pull_request:
    paths:
      - ".github/workflows/historical-youtube-metadata-sweep.yml"
      - "data/external-acquisition-targets.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        source_id:
          - youtube-ledger-01-eXxklNxsVWw
          - youtube-ledger-02-Mhxynz-LoAI
          - youtube-ledger-03-fu7gmuJQKXM
          - youtube-ledger-04-jQUf8yhqEc4
          - youtube-ledger-05-ahCmqg1hhSA
          - youtube-ledger-06-G4z5r4rZH2w
          - youtube-ledger-07-Pbkq8Ey_s0k
          - youtube-ledger-08-d23bAqGtImo
          - youtube-ledger-09-Y7OqMKBbM2Y
          - youtube-ledger-10-uP5nSeyac_o
          - youtube-ledger-11-gqlQaHgRaHg
          - youtube-iam8bit-making-of-reveal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp with EJS support
        run: python -m pip install --disable-pip-version-check "yt-dlp[default]"
      - name: Materialize YouTube cookie jar
        shell: bash
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_COOKIES_B64"
          cookie_file="${RUNNER_TEMP}/youtube-cookies.txt"
          printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$cookie_file"
          chmod 600 "$cookie_file"
          echo "YTDLP_COOKIES_FILE=$cookie_file" >> "$GITHUB_ENV"
      - name: Resolve URL from manifest
        id: source
        shell: bash
        run: |
          url="$(python - <<'PY'
          import json
          sid = "${{ matrix.source_id }}"
          data = json.load(open("data/external-acquisition-targets.json", encoding="utf-8"))
          print(next(s["url"] for s in data["sources"] if s["id"] == sid))
          PY
          )"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Harvest metadata and thumbnail
        shell: bash
        run: |
          set -euo pipefail
          out="evidence-work/${{ matrix.source_id }}"
          mkdir -p "$out"
          set +e
          yt-dlp \
            --js-runtimes node \
            --cookies "$YTDLP_COOKIES_FILE" \
            --skip-download \
            --write-info-json \
            --write-description \
            --write-thumbnail \
            --paths "$out" \
            --output "%(id)s/%(title).200B [%(id)s].%(ext)s" \
            "${{ steps.source.outputs.url }}" \
            2>&1 | tee "$out/extractor.log"
          code=${PIPESTATUS[0]}
          set -e
          printf '{"source_id":"%s","exit_code":%d}\n' "${{ matrix.source_id }}" "$code" > "$out/sweep-result.json"
          exit 0
      - name: Discover leads
        run: python scripts/external_evidence/discover_leads.py "evidence-work/${{ matrix.source_id }}" || true
      - name: Upload source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-youtube-${{ matrix.source_id }}-${{ github.run_id }}
          path: evidence-work/${{ matrix.source_id }}/
          if-no-files-found: warn
          retention-days: 14
