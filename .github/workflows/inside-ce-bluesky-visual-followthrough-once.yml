name: One-shot CE public image and censored query review

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  public-image-review-once:
    if: ${{ github.event.pull_request.head.ref == 'research/bluesky-caswell-telemon-visual-followthrough-20261016' && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact offline controls, no network
        run: |
          python -m unittest discover -s tests -p 'test_bluesky_ce_visual_followthrough.py' -v
          python -m unittest discover -s tests -p 'test_bluesky_ce_recall.py' -v
          python -m unittest discover -s tests -p 'test_bluesky_ce_discovery.py' -v
          python -m unittest discover -s tests -p 'test_bluesky_ce_triage.py' -v
      - name: Retrieve only three public image objects and replay four frozen query scopes
        run: |
          python scripts/probe_bluesky_ce_visual_followthrough.py --execute \
            --output research-output/ce-bluesky-visual-followthrough
      - name: Print acquisition accounting without asserting physical evidence
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          file=Path("research-output/ce-bluesky-visual-followthrough/source-followthrough.json")
          if not file.exists():
              print("NO_CAPTURE: live stage never completed")
          else:
              r=json.loads(file.read_text())
              print("QUERY_SUMMARY",json.dumps({
                  "requests_sent":r["requests_sent"],
                  "success":r.get("successful_search_requests"),
                  "errors":r.get("failed_search_requests"),
                  "stop":r.get("stop_reason"),
                  "query_phases":[{
                      "key":x.get("key"),"phase":x.get("phase"),"status":x["status"],
                      "returned":x.get("source",{}).get("returned"),
                      "cursor":x.get("has_further_cursor")} for x in r["query_records"]],
                  "image_acquisition":[{
                      "case":x["case_id"],"status":x["status"],
                      "bytes":x.get("bytes"),"sha256":x.get("sha256"),
                      "error":x.get("error")} for x in r["image_records"]],
                  "new_confirmed_stickers":0,
              }))
          PY
          find research-output -type f -maxdepth 3 -exec file {} \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ce-bluesky-three-images-four-query-scopes-once
          path: research-output/
          retention-days: 14
          if-no-files-found: warn
