name: Plan native-language INSIDE CE ownership searches

on:
  pull_request:
    paths:
      - 'scripts/build_inside_ce_native_search_campaign.py'
      - 'scripts/run_global_forum_index_search.py'
      - 'tests/test_global_forum_index_resume.py'
      - 'scripts/triage_inside_ce_index_results.py'
      - 'tests/test_inside_ce_index_triage.py'
      - 'tests/test_inside_ce_native_campaign.py'
      - 'tests/test_global_forum_search_plan.py'
      - 'data/reference/global-gaming-forum-archive-routes.tsv'
      - 'data/reference/inside-ce-native-search-lexicon.tsv'
      - 'data/reference/inside-ce-ownership-secondary-platforms.tsv'
      - '.github/workflows/inside-ce-native-search-campaign.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build_inside_ce_native_search_campaign.py'
      - 'data/reference/inside-ce-native-search-lexicon.tsv'
      - '.github/workflows/inside-ce-native-search-campaign.yml'
  workflow_dispatch:
    inputs:
      categories:
        description: "Campaign scope"
        required: true
        default: all
        type: choice
        options:
          - all
          - owners_and_numbers
          - arg_and_unboxing
      source_scope:
        description: "Where optional paid index lookups start"
        required: true
        default: secondary
        type: choice
        options:
          - secondary
          - forums
      site_statuses:
        description: "Existing forum evidence groups"
        required: true
        default: V,C,H
        type: choice
        options:
          - V,C,H
          - V
          - V,C
      execute_index:
        description: "Run the opt-in official web-index API if secret is configured"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
      start_index:
        description: "Index of first unsearched task from the previous run (default 0)"
        required: true
        default: "0"
        type: string
      manifest_sha256:
        description: "Required on resumed runs: paste manifest SHA256 from prior summary"
        required: false
        default: ""
        type: string
      max_index_queries:
        description: "Paid API index calls, 1-1000 (default 20)"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  build-native-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test owner evidence index triage and permalink provenance
        run: python -m unittest discover -s tests -p test_inside_ce_index_triage.py -v
      - name: Test cumulative index cursor and rate-limit regression
        run: python -m unittest discover -s tests -p test_global_forum_index_resume.py -v
      - name: Verify exact global forum and archival source matrices
        run: python -m unittest discover -s tests -p test_global_forum_search_plan.py -v
      - name: Test locale mappings and source joins
        run: python -m unittest discover -s tests -p 'test_inside_ce_native_campaign.py' -v
      - name: Build native-language, forum-scoped task ledger (offline)
        env:
          CATEGORIES: ${{ inputs.categories || 'all' }}
          STATUSES: ${{ inputs.site_statuses || 'V,C,H' }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          cmd = [
              "python", "scripts/build_inside_ce_native_search_campaign.py",
              "--output", "search-output/inside-ce-native-tasks.jsonl",
              "--summary", "search-output/inside-ce-native-summary.json",
              "--secondary-output", "search-output/inside-ce-secondary-tasks.jsonl",
              "--statuses", os.environ["STATUSES"],
          ]
          scope = os.environ["CATEGORIES"]
          if scope == "owners_and_numbers":
              for category in ("product_anchor_iam8bit", "product_anchor_realdoll",
                               "native_sticker_broad", "native_arrival_broad",
                               "huddle_with_inside", "huddle_with_iam8bit",
                               "statue_with_playdead", "figure_with_playdead",
                               "collecters_typo", "collectors_no_apostrophe",
                               "special_edition_iam8bit", "limited_edition_playdead",
                               "deluxe_edition_playdead",
                               "owner_bought", "owner_received",
                               "owner_without_game_name", "edition_number",
                               "serial_without_title", "for_sale",
                               "sticker_photograph", "outer_wrapper",
                               "wrapper_without_title", "sticker_with_number",
                               "edition_broad"):
                  cmd.extend(("--category", category))
          if scope == "arg_and_unboxing":
              for category in ("product_anchor_iam8bit", "product_anchor_realdoll",
                               "native_sticker_broad", "huddle_with_inside",
                               "huddle_with_iam8bit", "statue_with_playdead",
                               "figure_with_playdead", "arg_discussion", "unboxing",
                               "sticker_photograph", "edition_discussion",
                               "unboxing_without_game_name", "outer_wrapper"):
                  cmd.extend(("--category", category))
          subprocess.run(cmd, check=True)
          PY
      - name: Optional, bounded official Brave Search API index lookup
        if: ${{ inputs.execute_index == 'yes' }}
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          MAX_INDEX_QUERIES: ${{ inputs.max_index_queries }}
          INDEX_START: ${{ inputs.start_index || '0' }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 || '' }}
          SOURCE_SCOPE: ${{ inputs.source_scope || 'secondary' }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          tasks = ("search-output/inside-ce-secondary-tasks.jsonl"
                   if os.environ["SOURCE_SCOPE"] == "secondary"
                   else "search-output/inside-ce-native-tasks.jsonl")
          subprocess.run([
              "python", "scripts/run_global_forum_index_search.py",
              "--tasks", tasks,
              "--output", "search-output/inside-ce-index-results.jsonl",
              "--summary", "search-output/inside-ce-index-summary.json",
              "--max-queries", os.environ["MAX_INDEX_QUERIES"],
              "--start-index", os.environ["INDEX_START"],
              "--expect-manifest-sha256", os.environ["EXPECTED_MANIFEST_SHA256"],
          ], check=True)
          PY
      - name: Read canonical public community sticker link ledger
        if: ${{ inputs.execute_index == 'yes' }}
        uses: actions/checkout@v4
        with:
          repository: twinysam/INSIDE-ARG
          ref: master
          path: canonical-inside-arg
          persist-credentials: false
      - name: Offline reconcile CE index results into unverified leads
        if: ${{ inputs.execute_index == 'yes' }}
        run: |
          python scripts/triage_inside_ce_index_results.py \
            --input search-output/inside-ce-index-results.jsonl \
            --canonical-stickers canonical-inside-arg/stickers.md \
            --output search-output/inside-ce-index-candidates.tsv \
            --summary search-output/inside-ce-index-triage-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: inside-ce-native-search-campaign
          path: search-output/
          retention-days: 30
          if-no-files-found: error
