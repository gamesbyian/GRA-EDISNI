name: Audit CE public owner-source recall

on:
  pull_request:
    paths:
      - 'scripts/crosscheck_inside_ce_public_handles.py'
      - 'tests/test_inside_ce_public_handle_crosscheck.py'
      - 'data/reference/inside-ce-owner-source-recall-controls-2026-10-13.tsv'
      - '.github/workflows/inside-ce-owner-recall-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-source-recall:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: twinysam/INSIDE-ARG
          ref: master
          path: canonical-inside-arg
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test eight source controls and exact platform matching
        run: python -m unittest discover -s tests -p 'test_inside_ce_public_handle_crosscheck.py' -v
      - name: Reconcile original public source controls with live canonical list
        run: |
          python - <<'PY'
          import csv, json, subprocess
          from pathlib import Path
          source=Path('data/reference/inside-ce-owner-source-recall-controls-2026-10-13.tsv')
          records=list(csv.DictReader(source.open(encoding='utf-8'),delimiter='\t'))
          dest=Path('search-output')
          dest.mkdir(exist_ok=True)
          inp=dest/'public-source-control-candidates.jsonl'
          inp.write_text(''.join(json.dumps({
              'source_url':r['source_url'], 'public_platform':r['platform'],
              'public_author':r['public_author']
          })+'\n' for r in records),encoding='utf-8')
          subprocess.run([
            'python','scripts/crosscheck_inside_ce_public_handles.py',
            '--candidates',str(inp),
            '--canonical-stickers','canonical-inside-arg/stickers.md',
            '--output',str(dest/'public-owner-reconciliation.tsv'),
            '--summary',str(dest/'public-owner-reconciliation-summary.json')
          ],check=True)
          with (dest/'public-owner-reconciliation.tsv').open(encoding='utf-8') as f:
            result=list(csv.DictReader(f,delimiter='\t'))
          assert len(result)==len(records)
          matched={r['public_author']:r['canonical_sticker_entries']
                   for r in result if r['canonical_handle_relation']=='same_platform_handle_in_canonical_needs_review'}
          for author,label in [('Knuckles316','L08'),('juxjuxjux','338'),
                               ('Afaith_1','L46'),('No-Program385','470'),('Shaxai','U47')]:
            assert label in matched.get(author,''),(author,label,matched)
          assert all(r['new_confirmed_stickers']=='0' for r in result)
          print(json.dumps({'control_count':len(result),
                            'known_owner_source_controls_recalled':5,
                            'matched':matched,'new_confirmed_stickers':0}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inside-ce-public-owner-source-recall
          path: search-output/
          retention-days: 30
          if-no-files-found: warn
