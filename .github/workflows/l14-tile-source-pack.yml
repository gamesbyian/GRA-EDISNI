name: L14 tile recovery source pack

on:
  push:
    branches:
      - "chatgpt/external-evidence-harvester-2026-09-29"
    paths:
      - ".github/workflows/l14-tile-source-pack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check "yt-dlp[default]"
      - name: Materialize YouTube cookie jar
        shell: bash
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_COOKIES_B64"
          cookie_file="${RUNNER_TEMP}/youtube-cookies.txt"
          printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$cookie_file"
          chmod 600 "$cookie_file"
          echo "YTDLP_COOKIES_FILE=$cookie_file" >> "$GITHUB_ENV"
      - name: Download bounded L14 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/l14
          yt-dlp \
            --js-runtimes node \
            --cookies "$YTDLP_COOKIES_FILE" \
            --download-sections "*00:01:13-00:01:19" \
            --force-keyframes-at-cuts \
            -f "bv*+ba/b" \
            --merge-output-format mkv \
            --paths /tmp/l14 \
            --output "inside-gaming-0113-0119.%(ext)s" \
            "https://www.youtube.com/watch?v=AO2YQCl5qFM"
      - name: Extract every native frame
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p l14-tile-pack/native
          video="$(find /tmp/l14 -type f \( -name '*.mkv' -o -name '*.mp4' -o -name '*.webm' \) | head -n 1)"
          ffmpeg -hide_banner -loglevel error -i "$video" -vsync 0 l14-tile-pack/native/frame-%04d.png
          cp archive/research-files/tiles_with_masks.png l14-tile-pack/tiles_with_masks.png
          cp archive/research-files/h108_symbol_background_cell_stats.csv l14-tile-pack/
          cp archive/project-files/inside_tile_seam_metrics.csv l14-tile-pack/
      - name: Upload tile-recovery pack
        uses: actions/upload-artifact@v4
        with:
          name: l14-tile-recovery-source-${{ github.run_id }}
          path: l14-tile-pack/
          if-no-files-found: error
          retention-days: 14
