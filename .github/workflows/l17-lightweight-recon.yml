name: L17 lightweight reconnaissance

on:
  push:
    branches:
      - chatgpt/external-evidence-harvester-2026-09-29
    paths:
      - .github/workflows/l17-lightweight-recon.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight media tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check "yt-dlp[default]"
      - name: Materialize YouTube cookie jar
        shell: bash
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_COOKIES_B64"
          cookie_file="${RUNNER_TEMP}/youtube-cookies.txt"
          printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$cookie_file"
          chmod 600 "$cookie_file"
          echo "YTDLP_COOKIES_FILE=$cookie_file" >> "$GITHUB_ENV"
      - name: Download low-resolution video only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-work/l17/source
          yt-dlp \
            --js-runtimes node \
            --cookies "$YTDLP_COOKIES_FILE" \
            --write-info-json \
            --write-thumbnail \
            --no-write-subs \
            --no-write-auto-subs \
            -f "bestvideo[height<=240]/worstvideo" \
            --paths evidence-work/l17/source \
            --output "%(id)s.%(ext)s" \
            "https://www.youtube.com/watch?v=Pbkq8Ey_s0k"
      - name: Extract whole-source and scene reconnaissance
        shell: bash
        run: |
          set -euo pipefail
          video="$(find evidence-work/l17/source -type f \( -name '*.mp4' -o -name '*.webm' -o -name '*.mkv' \) | head -n 1)"
          test -n "$video"
          mkdir -p evidence-work/l17/recon/sample-1s evidence-work/l17/recon/scenes
          ffmpeg -hide_banner -loglevel warning -i "$video" -vf fps=1 -vsync vfr evidence-work/l17/recon/sample-1s/frame-%06d.jpg
          ffmpeg -hide_banner -loglevel warning -i "$video" -vf "select='gt(scene,0.25)'" -vsync vfr evidence-work/l17/recon/scenes/scene-%06d.jpg
      - name: Upload lightweight L17 reconnaissance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l17-lightweight-recon-${{ github.run_id }}
          path: |
            evidence-work/l17/recon/
            evidence-work/l17/source/*.json
            evidence-work/l17/source/*.webp
          if-no-files-found: warn
          retention-days: 14
