name: One-shot authentic archived 2021 acorn and RunningMan assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/recover_archived_2021_acorn_source.py
      - .github/workflows/one-shot-archived-acorn-source.yml

permissions:
  contents: read

jobs:
  authentic-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image inspection dependency
        run: python -m pip install "Pillow>=10,<12"
      - name: Acquire source-authenticated 2021 acorn and running man exports
        run: python scripts/recover_archived_2021_acorn_source.py
      - name: Preserve original assets and inspection images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-authentic-2021-acorn-runningman-export
          path: acorn_2021_original_export/
          retention-days: 30
          if-no-files-found: warn
