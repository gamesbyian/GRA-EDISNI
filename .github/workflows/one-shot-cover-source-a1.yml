name: One-shot original INSIDE cover scan integrity and review sheets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probe_original_cover_a1.py
      - .github/workflows/one-shot-cover-source-a1.yml

permissions:
  contents: read

jobs:
  cover-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install presentation dependency
        run: python -m pip install "Pillow>=10,<12"
      - name: Test coordinate tiler without web access
        run: python scripts/probe_original_cover_a1.py --self-test --output cover_source_artifacts
      - name: Retrieve only pinned original 2020 cover scans and source crops
        run: python scripts/probe_original_cover_a1.py --output cover_source_artifacts
      - name: Preserve audit report and manually readable coordinate indices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authentic-original-inside-cover-coordinate-review
          path: cover_source_artifacts/
          retention-days: 30
          if-no-files-found: warn
