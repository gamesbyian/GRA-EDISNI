name: Persist L14 forensic review bundle

on:
  push:
    branches:
      - "chatgpt/external-evidence-harvester-2026-09-29"
    paths:
      - ".github/workflows/persist-l14-forensics.yml"
      - "scripts/external_evidence/reproduce_l14_forensics.py"

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install forensic tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check "yt-dlp[default]" pillow numpy opencv-python-headless scikit-image
      - name: Materialize YouTube cookie jar
        shell: bash
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_COOKIES_B64"
          cookie_file="${RUNNER_TEMP}/youtube-cookies.txt"
          printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$cookie_file"
          chmod 600 "$cookie_file"
          echo "YTDLP_COOKIES_FILE=$cookie_file" >> "$GITHUB_ENV"
      - name: Download bounded source and known-sticker reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/l14"
          yt-dlp \
            --js-runtimes node \
            --cookies "$YTDLP_COOKIES_FILE" \
            --download-sections "*00:01:10-00:01:25" \
            --force-keyframes-at-cuts \
            -f "bv*+ba/b" \
            --merge-output-format mkv \
            --paths "$RUNNER_TEMP/l14" \
            --output "inside-gaming-0110-0125.%(ext)s" \
            "https://www.youtube.com/watch?v=AO2YQCl5qFM"
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/l14/known-324.jpg" \
            "https://raw.githubusercontent.com/twinysam/INSIDE-ARG/master/images/stickers/324.jpg"
      - name: Reproduce review products
        shell: bash
        run: |
          set -euo pipefail
          video="$(find "$RUNNER_TEMP/l14" -maxdepth 1 -type f \( -name '*.mkv' -o -name '*.mp4' -o -name '*.webm' \) | head -n 1)"
          out="archive/external/inside-gaming-l14/forensic-review"
          rm -rf "$out"
          mkdir -p "$out"
          python scripts/external_evidence/reproduce_l14_forensics.py \
            --video "$video" \
            --reference-sticker "$RUNNER_TEMP/l14/known-324.jpg" \
            --output "$out"
          cat > "$out/README.md" <<'EOF'
# Inside Gaming L14 forensic review bundle

Source: Inside Gaming Collector's Edition unboxing, YouTube `AO2YQCl5qFM`.
Canonical historical identity: lost sticker **L14**, symbol **`/`**, serial unknown.

These images are non-generative review aids reproduced from native source video pixels.
The known `324.jpg` photograph is used only as a physical sticker-layout and degradation
reference. No AI super-resolution, inpainting, synthetic detail, or OCR reconstruction is used.

Methods represented in the bundle include native-frame contact sheets, conservative
enlargement/sharpening, per-channel inspection, Richardson-Lucy deconvolution,
affine/perspective normalization, adjacent-frame ECC registration, and temporal stacking.

The serial-number region is geometrically occluded by the presenter's fingers throughout
the useful sequence. Faint marks elsewhere on the sticker are not in the expected serial
position and must not be promoted as digits.

The `clean324_simulated*.jpg` files are method sanity checks that deliberately degrade a
known sticker photograph. They are **not evidence about L14**.

Regenerate with:

```
python scripts/external_evidence/reproduce_l14_forensics.py \
  --video <bounded-1m10s-to-1m25s-source> \
  --reference-sticker <known-324-photo> \
  --output archive/external/inside-gaming-l14/forensic-review
```
EOF
      - name: Commit derived review bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/external/inside-gaming-l14/forensic-review
          if git diff --cached --quiet; then
            echo "No forensic bundle changes."
            exit 0
          fi
          git commit -m "archive: preserve L14 forensic review bundle"
          git push origin HEAD
