name: One-shot original INSIDE web receiver archive probe

# Runs precisely on the PR introducing/modifying this workflow; never on main.
# Bounded archival metadata and at most two replay samples per target.
on:
  pull_request:
    paths:
      - ".github/workflows/probe-original-inside-receivers-2026-10-16.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-receiver-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline safety and archive-parser tests
        run: |
          python -m unittest discover -s tests -p test_historical_receiver_archive_probe.py -v
          python scripts/probe_arquivo_iframe_receiver.py
      - name: Follow original Arquivo.pt 2018-2019 iframe URLs, not the viewer shells
        run: python scripts/probe_arquivo_iframe_receiver.py --execute --out search-output/arquivo-iframe-replay-2026-10-16.json
      - name: Save exact archive replies and candidate replay bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-inside-receiver-archive-probe
          path: search-output/
          retention-days: 30
          if-no-files-found: warn
