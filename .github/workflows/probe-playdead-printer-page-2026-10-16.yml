name: Manual historical Playdead printer page HTML replay

# The original one-shot archive run completed on 16 October 2026.
# Manual only thereafter to avoid redundant archival requests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-html:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify offline original URL guard and HTML parser
        run: python scripts/probe_playdead_printer_page_html.py
      - name: Explicit archival HTML replay
        run: python scripts/probe_playdead_printer_page_html.py --execute
      - name: Preserve archived raw HTML and source metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playdead-original-2018-2019-printer-html
          path: search-output/
          retention-days: 30
          if-no-files-found: warn
