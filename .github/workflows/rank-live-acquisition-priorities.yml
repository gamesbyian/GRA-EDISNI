name: Experiment 422 live acquisition priorities

on:
  pull_request:
    paths:
      - "scripts/rank_live_acquisition_targets.py"
      - "scripts/audit_completion_universe_layers.py"
      - "scripts/enumerate_raw_machine.py"
      - "data/observations.csv"
      - "docs/experiment-422-live-acquisition-priorities.md"
      - ".github/workflows/rank-live-acquisition-priorities.yml"
  push:
    branches: ["main"]
    paths:
      - "scripts/rank_live_acquisition_targets.py"
      - "scripts/audit_completion_universe_layers.py"
      - "scripts/enumerate_raw_machine.py"
      - "data/observations.csv"

jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/rank_live_acquisition_targets.py
      - run: git diff --exit-code -- data/experiment-422-live-acquisition-priorities.json
