name: Recent unresolved owner public probe

on:
  push:
    branches:
      - chatgpt/external-evidence-harvester-2026-09-29
    paths:
      - .github/workflows/recent-owner-public-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        source_id:
          - owner-u35-grifteskymfning-psnprofiles
          - owner-u40-playstation-instagram
          - owner-u41-lvncqw-pricecharting
          - owner-u42-vrxqyq-pricecharting
          - owner-u43-jotonic-pricecharting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public extractor
        run: python -m pip install --disable-pip-version-check gallery-dl
      - name: Probe one recent owner source
        shell: bash
        run: |
          set -euo pipefail
          args=(--source-id "${{ matrix.source_id }}")
          if [[ "${{ matrix.source_id }}" == "owner-u40-playstation-instagram" ]]; then
            args+=(--include-social)
          fi
          python scripts/external_evidence/harvest_public.py "${args[@]}"
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recent-owner-${{ matrix.source_id }}-${{ github.run_id }}
          path: evidence-work/${{ matrix.source_id }}/
          if-no-files-found: warn
          retention-days: 14
