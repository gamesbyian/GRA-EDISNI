name: Targeted YouTube comment snapshot

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: "Exact YouTube source id from data/external-acquisition-targets.json"
        required: true
        type: string

permissions:
  contents: read

jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp with EJS support
        run: python -m pip install --disable-pip-version-check "yt-dlp[default]"
      - name: Materialize YouTube cookie jar
        shell: bash
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_COOKIES_B64"
          cookie_file="${RUNNER_TEMP}/youtube-cookies.txt"
          printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$cookie_file"
          chmod 600 "$cookie_file"
          echo "YTDLP_COOKIES_FILE=$cookie_file" >> "$GITHUB_ENV"
      - name: Resolve URL and validate source
        id: source
        shell: bash
        run: |
          url="$(python - <<'PY'
          import json
          source_id = "${{ inputs.source_id }}"
          manifest = json.load(open("data/external-acquisition-targets.json", encoding="utf-8"))
          source = next((item for item in manifest["sources"] if item["id"] == source_id), None)
          if source is None:
              raise SystemExit(f"unknown source_id: {source_id}")
          if source.get("kind") != "youtube":
              raise SystemExit(f"source is not YouTube: {source_id}")
          print(source["url"])
          PY
          )"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Snapshot comments and metadata only
        shell: bash
        run: |
          set -euo pipefail
          out="evidence-work/${{ inputs.source_id }}/comments"
          mkdir -p "$out"
          yt-dlp             --js-runtimes node             --cookies "$YTDLP_COOKIES_FILE"             --skip-download             --write-comments             --write-info-json             --write-description             --no-write-subs             --no-write-auto-subs             --paths "$out"             --output "%(id)s/%(title).200B [%(id)s].%(ext)s"             "${{ steps.source.outputs.url }}"
      - name: Upload comment snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-comments-${{ inputs.source_id }}-${{ github.run_id }}
          path: evidence-work/${{ inputs.source_id }}/comments/
          if-no-files-found: warn
          retention-days: 14
