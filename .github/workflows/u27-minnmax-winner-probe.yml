name: U27 MinnMax winner transcript probe

on:
  push:
    branches:
      - chatgpt/external-evidence-harvester-2026-09-29
    paths:
      - .github/workflows/u27-minnmax-winner-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check "yt-dlp[default]"
      - name: Materialize YouTube cookie jar
        shell: bash
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_COOKIES_B64"
          cookie_file="${RUNNER_TEMP}/youtube-cookies.txt"
          printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$cookie_file"
          chmod 600 "$cookie_file"
          echo "YTDLP_COOKIES_FILE=$cookie_file" >> "$GITHUB_ENV"
      - name: Download English automatic captions only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-work/u27-transcript
          yt-dlp \
            --js-runtimes node \
            --cookies "$YTDLP_COOKIES_FILE" \
            --skip-download \
            --write-auto-subs \
            --sub-langs "en" \
            --sub-format "vtt" \
            --write-info-json \
            --paths evidence-work/u27-transcript \
            --output "%(id)s/%(title).160B [%(id)s].%(ext)s" \
            "https://www.youtube.com/watch?v=RMERjiTz3kg"
      - name: Extract winner-window transcript
        shell: bash
        run: |
          set -euo pipefail
          vtt="$(find evidence-work/u27-transcript -type f -name '*.vtt' | head -n1)"
          test -n "$vtt"
          python - "$vtt" <<'PY'
          import re, sys
          from pathlib import Path

          vtt = Path(sys.argv[1])
          out = vtt.parent / "winner-window.txt"
          lines = vtt.read_text(encoding="utf-8", errors="replace").splitlines()
          keep = []
          for i, line in enumerate(lines):
              m = re.match(r"(\d+):([0-5]\d):([0-5]\d)\.\d+ --> (\d+):([0-5]\d):([0-5]\d)\.\d+", line)
              if not m:
                  continue
              start = int(m.group(1))*3600 + int(m.group(2))*60 + int(m.group(3))
              end = int(m.group(4))*3600 + int(m.group(5))*60 + int(m.group(6))
              if end >= 25100 and start <= 25220:
                  keep.extend(lines[i:i+2])
          out.write_text("\n".join(keep) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY
      - name: Upload transcript probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u27-minnmax-winner-transcript-${{ github.run_id }}
          path: evidence-work/u27-transcript/
          if-no-files-found: warn
          retention-days: 14
