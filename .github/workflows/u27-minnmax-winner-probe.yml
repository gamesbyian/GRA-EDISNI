name: U27 MinnMax winner probe

on:
  push:
    branches:
      - chatgpt/external-evidence-harvester-2026-09-29
    paths:
      - .github/workflows/u27-minnmax-winner-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check "yt-dlp[default]"
      - name: Materialize YouTube cookie jar
        shell: bash
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_COOKIES_B64"
          cookie_file="${RUNNER_TEMP}/youtube-cookies.txt"
          printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$cookie_file"
          chmod 600 "$cookie_file"
          echo "YTDLP_COOKIES_FILE=$cookie_file" >> "$GITHUB_ENV"
      - name: Download only winner-announcement window
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-work/u27
          yt-dlp \
            --js-runtimes node \
            --cookies "$YTDLP_COOKIES_FILE" \
            --download-sections "*25120-25190" \
            --force-keyframes-at-cuts \
            --write-info-json \
            --write-thumbnail \
            --no-write-subs \
            --no-write-auto-subs \
            -f "bv*[height<=720]+ba/b[height<=720]" \
            --merge-output-format mkv \
            --paths evidence-work/u27 \
            --output "%(id)s/%(title).160B [%(id)s].%(ext)s" \
            "https://www.youtube.com/watch?v=RMERjiTz3kg"
      - name: Extract dense review frames
        shell: bash
        run: |
          set -euo pipefail
          video="$(find evidence-work/u27 -type f \( -name '*.mkv' -o -name '*.mp4' -o -name '*.webm' \) | head -n1)"
          test -n "$video"
          mkdir -p evidence-work/u27/review
          ffmpeg -hide_banner -loglevel warning -i "$video" -vf fps=2 -vsync vfr evidence-work/u27/review/frame-%05d.jpg
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u27-minnmax-winner-probe-${{ github.run_id }}
          path: evidence-work/u27/
          if-no-files-found: warn
          retention-days: 14
