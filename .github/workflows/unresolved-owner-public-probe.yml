name: Unresolved owner public evidence probe

on:
  push:
    branches:
      - chatgpt/external-evidence-harvester-2026-09-29
    paths:
      - .github/workflows/unresolved-owner-public-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        source_id:
          - owner-u32-koreanb-sale-2020
          - owner-u32-skorba71-transfer-2024
          - owner-u33-doctornowhere-x
          - owner-u44-squee-forum
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public extractor
        run: python -m pip install --disable-pip-version-check gallery-dl
      - name: Probe one unresolved owner source
        shell: bash
        run: |
          set -euo pipefail
          args=(--source-id "${{ matrix.source_id }}")
          if [[ "${{ matrix.source_id }}" == "owner-u33-doctornowhere-x" ]]; then
            args+=(--include-social)
          fi
          python scripts/external_evidence/harvest_public.py "${args[@]}"
      - name: Discover leads
        if: always()
        run: |
          if [[ -d "evidence-work/${{ matrix.source_id }}" ]]; then
            python scripts/external_evidence/discover_leads.py "evidence-work/${{ matrix.source_id }}" || true
          fi
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unresolved-owner-${{ matrix.source_id }}-${{ github.run_id }}
          path: evidence-work/${{ matrix.source_id }}/
          if-no-files-found: warn
          retention-days: 14
