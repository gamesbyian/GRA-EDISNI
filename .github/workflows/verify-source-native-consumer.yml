name: Verify source-native consumer gates

on:
  pull_request:
    paths:
      - "scripts/audit_source_native_consumer_affordances.py"
      - "scripts/audit_classword_lever_consumer.py"
      - "scripts/conjecture_lab_steam_password_direct.py"
      - "scripts/conjecture_lab_q4_roles.py"
      - "scripts/conjecture_lab_native_q4_receiver.py"
      - "scripts/conjecture_lab_native_q4_base27.py"
      - "scripts/conjecture_lab_q4_tile_band.py"
      - "scripts/conjecture_lab_url_digits_q4_depth.py"
      - "scripts/conjecture_lab_q4_dictionary_null.py"
      - "artifacts/background-tile-evidence-masters/**"
      - "data/printer-reference/pc-ps4-acorn-order.txt"
      - "scripts/conjecture_lab_128_output_consumer.py"
      - "scripts/conjecture_lab_534brn_capture_type_gate.py"
      - "data/534brn-canonical-partial-evidence-2026-10-08.json"
      - "data/experiment-423-534brn-mcu-constraint.json"
      - "archive/external/terminal41-534brn/X-xmp-fragment.bin"
      - "data/experiment-413-414-534brn-footer-128.json"
      - "data/experiment-416-128-mcu-uniqueness.json"
      - "data/experiment-478-source-native-consumer-affordances.json"
      - "data/observations.csv"
      - "data/endgame-saf-dat-island-2026-10-08.json"
      - "archive/external/twinysam-inside-arg/terminal41.link/comms_main_viewgate*.html"
      - "archive/external/twinysam-inside-arg/terminal41.link/sys/printreqstatus_SD.html"
      - "archive/external/twinysam-inside-arg/terminal41.link/dat/534brn9653f9j8mmd/index.html"
      - ".github/workflows/verify-source-native-consumer.yml"
  workflow_dispatch:

concurrency:
  group: source-native-consumers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check preserved HTML, corpus and typed lever output
        run: python scripts/audit_source_native_consumer_affordances.py > /tmp/source-consumer-gates.json
      - name: Verify natural A-I class-word bunker replay
        run: python scripts/audit_classword_lever_consumer.py > /tmp/classword-lever-477.json
      - name: Verify 128-character and conditional JPEG-row research
        run: python scripts/conjecture_lab_128_output_consumer.py > /tmp/128-output-receiver-audit.json
      - name: Verify independent JPEG erasure-type and XMP metadata gates
        run: python scripts/conjecture_lab_534brn_capture_type_gate.py > /tmp/534brn-capture-erasure-type-audit.json
      - name: Install evidence image reader
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify speculative Q4 receiving-artifact controls
        run: |
          python scripts/conjecture_lab_steam_password_direct.py > /tmp/steam-direct-control.txt
          python scripts/conjecture_lab_q4_roles.py > /tmp/q4-comparison.txt
          python scripts/conjecture_lab_native_q4_receiver.py > /tmp/native-q4-receiver.txt
          python scripts/conjecture_lab_native_q4_base27.py --out-json /tmp/native-q4-mask-bank.json > /tmp/native-q4-base27.txt
          python scripts/conjecture_lab_native_q4_receiver.py --allow-primary-dots > /tmp/native-q4-permissive.txt
          python scripts/conjecture_lab_native_q4_base27.py --allow-primary-dots > /tmp/native-q4-base27-permissive.txt
          python scripts/conjecture_lab_q4_tile_band.py --out-json /tmp/native-q4-tile-band.json > /tmp/native-q4-tile-band.txt
          python scripts/conjecture_lab_url_digits_q4_depth.py > /tmp/native-q4-url-depth.txt
          cat /tmp/native-q4-receiver.txt
          cat /tmp/native-q4-base27.txt
          cat /tmp/native-q4-tile-band.txt
      - name: Preserve speculative A-I/Q4 3x3 mask family
        uses: actions/upload-artifact@v4
        with:
          name: native-q4-binary-mask-bank
          path: /tmp/native-q4-mask-bank.json
      - name: Preserve masked-tile Q4 class-shuffle control
        uses: actions/upload-artifact@v4
        with:
          name: native-q4-tile-band-null
          path: /tmp/native-q4-tile-band.json
      - name: Show consumer audit summary
        run: |
          python -c 'import json; a=json.load(open("/tmp/source-consumer-gates.json")); print("sources:",a["artifact_total"],"new CE receivers:",a["verified_new_ce_value_receivers"],"type-compatible bunker direct placements:",a["known_lever_direct_replay_type_check"]["type_compatible_14_command_direct_placements"])'
