name: Verify original printer receiver bridges

on:
  pull_request:
  push:
    branches: [main]

jobs:
  source-receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check 108-to-Xbox literal print rows and frozen macOS marks
        run: python scripts/audit_native_printer_receiver_476.py --output /tmp/experiment-476.json --summary
      - name: Preserve complete receiver comparison
        uses: actions/upload-artifact@v4
        with:
          name: experiment-476-source-native-receiver-control
          path: /tmp/experiment-476.json
      - name: Audit finite CE readout invariance on canonical physical corpus
        run: python scripts/audit_finite_receiver_invariance.py --output /tmp/finite-receiver-invariance.json
      - name: Check source-native literal printer-window negative controls
        run: python scripts/audit_middle_depth_printer_control.py --output /tmp/middle-depth-printer-control.json
      - name: Check selection-aware A/G image-class coverage null
        run: python scripts/audit_class_coverage_selection_null.py --output /tmp/class-coverage-selection-null.json
      - name: Preserve finite receiver research witnesses
        uses: actions/upload-artifact@v4
        with:
          name: finite-receiver-invariance-controls
          path: |
            /tmp/finite-receiver-invariance.json
            /tmp/middle-depth-printer-control.json
            /tmp/class-coverage-selection-null.json
