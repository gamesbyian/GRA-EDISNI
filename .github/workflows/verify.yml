name: Verify machine

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify canonical closed-corpus machine
        run: python scripts/verify_machine.py
      - name: Verify independent native-state model
        run: python scripts/verify_native_model.py
      - name: Compare independent master families exactly
        run: python scripts/compare_models.py
      - name: Audit first-pass address substitution
        run: python scripts/audit_first_pass.py
      - name: Derive Q3 route shell
        run: python scripts/audit_q3_route_shell.py
      - name: Audit terminal selector reuse
        run: python scripts/audit_terminal_reuse.py
      - name: Audit raw primary constraints
        run: python scripts/audit_primary_raw_constraints.py
      - name: Audit primary polarity completion
        run: python scripts/audit_polarity_completion.py
      - name: Derive final primary polarity from recursion
        run: python scripts/audit_final_primary_polarity.py
      - name: Audit primary leave-one-out robustness
        run: python scripts/audit_primary_leave_one_out.py
      - name: Reconstruct machine from raw constraints
        run: python scripts/enumerate_raw_machine.py
      - name: Compare raw reconstruction to prior generators
        run: python scripts/compare_raw_reconstruction.py
      - name: Audit raw constraint flow
        run: python scripts/audit_raw_constraint_flow.py
      - name: Select recursion from raw candidate space
        run: python scripts/audit_raw_operation_family.py
      - name: Audit Q4 shared POS3 polarity
        run: python scripts/audit_q4_pos3_polarity.py
      - name: Audit optional-pulse primary grammar
        run: python scripts/audit_primary_optional_pulse.py
      - name: Audit frame-weight-three primary parent
        run: python scripts/audit_primary_frame_weight_three.py
      - name: Audit transition-invisible primary gauge
        run: python scripts/audit_primary_invisible_gauge.py
      - name: Audit primary gauge transport
        run: python scripts/audit_primary_gauge_transport.py
      - name: Stress-test primary gauge transport metric
        run: python scripts/audit_primary_gauge_metric_family.py
      - name: Audit centered primary sibling
        run: python scripts/audit_primary_centroid_sibling.py
      - name: Audit raw normalized frame repeats
        run: python scripts/audit_raw_frame_repeats.py
      - name: Audit primary projection factorization
        run: python scripts/audit_primary_projection_factorization.py
      - name: Audit primary fork functional rank
        run: python scripts/audit_primary_functional_rank.py
      - name: Audit Q4 polarity assignment boundary
        run: python scripts/audit_q4_polarity_assignments.py
      - name: Audit primary frame-balance recovery
        run: python scripts/audit_primary_frame_balance.py
      - name: Audit primary frame-balance minimality
        run: python scripts/audit_primary_balance_minimality.py
      - name: Exhaust frame-balance partitions
        run: python scripts/audit_frame_balance_partitions.py
      - name: Audit minimum primary witness
        run: python scripts/audit_minimum_primary_witness.py
      - name: Audit Q4 polarity gauge factorization
        run: python scripts/audit_q4_polarity_gauge.py
      - name: Audit Q4 gauge physical simplicity
        run: python scripts/audit_q4_gauge_physical_simplicity.py
      - name: Audit Q4 global symbol balance
        run: python scripts/audit_q4_global_symbol_balance.py
      - name: Audit ambiguous primary frame parsimony
        run: python scripts/audit_ambiguous_frame_parsimony.py
      - name: Audit raw-first POS3 cue
        run: python scripts/audit_raw_first_pos3_cue.py
      - name: Audit all POS3 rail partitions
        run: python scripts/audit_all_pos3_partitions.py
      - name: Validate POS3 rails on holdout data
        run: python scripts/audit_pos3_partition_holdout.py
      - name: Audit coupled affine first-pass recursion
        run: python scripts/audit_affine_first_pass.py
      - name: Audit affine retention degeneracy
        run: python scripts/audit_affine_degeneracy.py
      - name: Audit nonlinear fiber-preserving recursion
        run: python scripts/audit_fiber_preserving_recursion.py
      - name: Audit idempotent recursion criterion
        run: python scripts/audit_idempotent_recursion.py
      - name: Audit terminal fixed-point stability
        run: python scripts/audit_terminal_fixed_point.py
      - name: Classify terminal orbit dynamics
        run: python scripts/audit_terminal_orbit_dynamics.py
      - name: Explain f1 recursion gauge support
        run: python scripts/audit_f1_gauge_support.py
      - name: Audit corrected cross-gauge coupling
        run: python scripts/audit_full_gauge_quotient.py
      - name: Test F+I Q3 route obstruction
        run: python scripts/audit_fi_route_obstruction.py
      - name: Explain Q4 A/C gauge support
        run: python scripts/audit_q4_ac_gauge_support.py
      - name: Audit independent Q4 polarity route
        run: python scripts/audit_q4_independent_polarity_route.py
      - name: Recover Q4 core and terminal from arbitrary selectors
        run: python scripts/audit_q4_arbitrary_selector_route.py
      - name: Recover physical Q4 POS3 codebook from holdout marks
        run: python scripts/audit_q4_physical_codebook.py
      - name: Stress-test Q4 codebook label symmetry
        run: python scripts/audit_q4_label_symmetry.py
      - name: Audit weaker input POS3 recovery
        run: python scripts/audit_weaker_input_pos3.py
      - name: Audit Discord community master provenance
        run: python scripts/audit_discord_master.py
      - name: Audit historical Discord column-shift transform
        run: python scripts/audit_discord_column_shifts.py
      - name: Audit historical Discord Sticker Studio predictors
        run: python scripts/audit_discord_sticker_studio.py
      - name: Audit human coordinate-copy operations
        run: python scripts/audit_human_coordinate_copy.py
      - name: Audit human second selector choice
        run: python scripts/audit_human_second_selection.py
      - name: Verify machine-spec drift
        run: python scripts/verify_machine_spec.py
      - name: Verify executable proof pack
        run: python scripts/verify_proof_pack.py
